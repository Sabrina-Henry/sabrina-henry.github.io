hugoblox:
  schema: "2.0"
  identity:
    name: Sabrina Henry
    type: person
    tagline: PhD Researcher | Explainable AI
    description: PhD researcher specialising in explainable and interpretable AI for high-stakes applications including healthcare, security, and autonomous vehicles.
    organization: Sabrina Henry
  theme:
    mode: light
    pack: matcha
    colors:
      primary: "#4b211b"
      secondary: "#4b211b"
      neutral: "stone"
    surfaces:
      background: "#f9f6f0"
      foreground: "#f9f6f0"
      header:
        background: "#BA3801"
        foreground: "#f9f6f0"
      footer:
        background: "#25150c"
        foreground: "#fcf6e1"
    colors_light:
      primary: "#BA3801"
      secondary: "#BA3801"
      neutral: "#4b211b"
    colors_dark:
      primary: "#84784c"
      secondary: "#84784c"
      neutral: "#25150c"
  typography:
    font: sans
    size: md
    pack: modern
  layout:
    radius: md
    spacing: spacious
    avatar_shape: circle
  header:
    enable: true
    style: navbar
    sticky: true
    align: center
    search: true
    theme_toggle: false
  footer:
    style: minimal
    language_switcher: true
  copyright:
    notice: © {year} {name}
    license:
      type: cc
  content:
    math:
      enable: false
    toc:
      enable: true
    reading_time:
      enable: true
  search:
    enable: true
